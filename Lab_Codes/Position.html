<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>

    <style>
        div.stick{
        position: sticky;
        top: 0;
        border: 2px solid black;
        background-color: lightblue;
        padding: 50px;
        font-size: 20px;
        margin-bottom: 20px;
        }
         
         div.ext{
         position: relative;
         top: 100px;
         border: 2px solid black;
         background-color: lightgreen;
         width:100px;
         height:100px;
         }

         div.rel{
         position:absolute ;
         border: 2px solid black;
         background-color: lightcoral;
         width:100px;
         height:100px;
         bottom: 20px;
          right: 20px;
         }
      
         
    </style>
</head>
<body>
    <h2>CSS Position</h2>
    <p>The position property specifies the type of positioning method used for an element (static, relative, absolute, fixed, or sticky).</p>
<div class="stick">This div becomes the immediate ancestor.</div>
<div class="ext">This div is the external div.</div>
<div class="rel">This div is relatively positioned.</div>
</body>
</html>
