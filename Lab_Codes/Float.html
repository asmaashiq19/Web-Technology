<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Property</title>
    <style>
        div {
            float: left;
            width: 200px;
            height: 100px;
            margin: 10px;
            padding: 10px;
            background-color: lightblue;
            border: 1px solid black;
        }
        img{
            float: left;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h2>Float Property</h2>
    <p>The float property specifies how an element should float.</p>
    <div>Hey! </div>
    <div>Welcome to my page.</div>
    <div>Hope you like it!</div>
    <img src="pexels-alexkrugla-18931355.jpg" alt="Image" width="200" height="200">
</body>
</html>
