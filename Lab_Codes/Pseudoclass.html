<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoclass</title>
    <link rel="stylesheet" href="pseudoclass.css">

</head>
<body>
    <h2>Structural Pseudoclass</h2>
    <div>
        <p>I am the first <em>child</em></p>
        <p>I am the 2nd child</p>
        <p>I am the first  <em>EM</em> word in the text and i am the 2nd <em>EM</em> word</p>
    </div>
    <p>Here is the use of lang:<q lang="yes">I am selected by the lang pseudoclass </q>hope you got it</p>
    <div class="div2">
        <p>
            I am the first child in the 2nd div with the class div2 <em>I am emphasized</em>
        </p>
    </div>
</body>
